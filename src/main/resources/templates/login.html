<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <script th:src="@{/js/script.js}"></script>
    <title>Login </title>
</head>
<body>
<header>
    <h1>Pagina de Login.</h1>
    <section>
        <img th:src="@{/img/image.png}" alt="">
    </section>
</header>
<main>
    <section class="section_principal">
        <h2>Faça seu Login. </h2>
        <form class="formLogin">
            <label for="name">Nome:</label><br>
            <input type="text" placeholder="Digite seu nome." id="name"><br>
            <label for="email">Email:</label><br>
            <input type="email" placeholder="Digite seu email." id="email"><br>
            <label for="pwd">Senha:</label> <br>
            <input type="password" name="password" id="pwd" placeholder="Digite sua senha."> <br>
            <input type="button" value="Entrar" onclick="login()">
        </form>
    </section>
</main>
</body>
<footer>

</footer>
</html>
